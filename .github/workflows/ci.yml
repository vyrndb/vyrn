name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  linux-durability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vyrn-core --test crash_recovery --locked -- --nocapture
      - run: cargo test -p vyrn-core --test corruption --locked
      - run: cargo test -p vyrn-core --test redo_recovery --locked
      - run: cargo test -p vyrn-core --test pitr --locked
      - run: cargo test -p vyrn-core --test wal_archive --locked
      - run: bash scripts/smoke-linux.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The crash soak is the one durability proof no unit test can give: SIGKILL
  # mid-write and SIGTERM-under-async against the real shipped stack, over
  # and over, asserting exactly what the server acknowledged. Linux-only by
  # design (real signals, real directory-entry durability); this job is what
  # discharges the "crash-soak has never run" release gate on every push.
  crash-soak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: VYRN_SOAK_CYCLES=12 VYRN_SOAK_WRITES=30 bash scripts/crash-soak.sh

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vyrn-ci .

  # Benches must never rot: compile every bench target, then one short
  # apply-profile run so the write-path instrumentation stays runnable. No
  # numeric thresholds — shared runners are too noisy to gate on timings,
  # and a gate everyone learns to ignore is worse than none.
  bench-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run --locked
      - run: CLIENTS=8 BATCHES=50 PREFILL=2000 cargo run --release -p vyrn-core --bin apply-profile
