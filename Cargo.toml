[workspace]
members = [
    "crates/vyrn-client",
    "crates/vyrn-cli",
    "crates/vyrn-core",
    "crates/vyrn-log",
    "crates/vyrn-protocol",
    "crates/vyrn-server",
    "crates/vyrn-http",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.87"

# Shipped binaries keep overflow checks on: the storage layer is u64-heavy
# (LSNs, page ids, WAL offsets) and a silent wraparound there is corruption,
# not a perf trade worth taking. LTO/codegen-units so release numbers match
# what benchmarks measure.
[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
argon2 = "0.5"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
fs2 = "0.4"
hex = "0.4"
proptest = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["codec"] }
url = "2.5"
