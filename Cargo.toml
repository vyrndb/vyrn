[workspace]
members = [
    "crates/vyrn-client",
    "crates/vyrn-cli",
    "crates/vyrn-core",
    "crates/vyrn-protocol",
    "crates/vyrn-server",
    "crates/vyrn-http",
]
resolver = "2"

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
argon2 = "0.5"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
fs2 = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["codec"] }
url = "2.5"
