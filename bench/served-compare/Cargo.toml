# Standalone on purpose (its own [workspace] detaches it from the repo's):
# the ScyllaDB driver tree is a heavy dependency the shipped binaries must
# not inherit, and this crate only ever runs on a benchmark host.
[package]
name = "served-compare"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
vyrn-client = { path = "../../crates/vyrn-client" }
scylla = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"

[profile.release]
debug = false
